name: SEPA Market Scan

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'requirements.txt'
      - '.github/workflows/sepa.yml'
  workflow_dispatch:
  schedule:
    # 08:00 and 19:00 KST, converted to UTC
    - cron: '0 23 * * *'
    - cron: '0 10 * * *'

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Unit tests
        run: python -m pytest -q
      - name: Download public daily OHLCV and compute SEPA
        env:
          PYTHONUNBUFFERED: '1'
          MAX_US_SCAN: '120'
          MAX_KR_SCAN: '100'
        run: python -m src.run
      - name: Upload analysis artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sepa-analysis
          path: output/
          if-no-files-found: warn
          retention-days: 30
